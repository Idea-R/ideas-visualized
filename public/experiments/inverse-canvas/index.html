<!doctype html>
<html lang="en" data-theme="light" data-palette="teal">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Inverse Canvas | Ideas Visualized</title>
  <link rel="stylesheet" href="./transition.css"><link rel="stylesheet" href="./stage.css">
</head>
<body>
  <canvas id="field" aria-hidden="true"></canvas>
  <div class="page">
    <header><a class="brand" href="#top" aria-label="AI Agency Underground"><b>AI AGENCY</b><span>UNDERGROUND</span></a><button id="flip" type="button" aria-label="Switch to dark mode" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m12 2 9 5v10l-9 5-9-5V7Zm0 10L3 7m9 5 9-5m-9 5v10"/></svg><span id="flip-label">Dark mode</span></button></header>
    <main id="top">
      <div class="hero">
        <div class="headline"><h1>Learn it.<br>Build it.<br><em>Make it work.</em></h1><p>Pick a useful problem.<br>Build something worth paying for.</p><button class="primary" id="replay" type="button">Flip the canvas <span aria-hidden="true">↗</span></button></div>
        <svg class="sculpture" viewBox="0 0 320 320" role="img" aria-label="Connected geometric cubes">
          <defs><linearGradient id="face" x2="1" y2="1"><stop stop-color="var(--accent)"/><stop offset="1" stop-color="var(--deep)"/></linearGradient><linearGradient id="edge" x2="0" y2="1"><stop stop-color="var(--soft)"/><stop offset="1" stop-color="var(--surface)"/></linearGradient></defs>
          <g fill="none" stroke="var(--line)"><ellipse cx="160" cy="170" rx="148" ry="80" transform="rotate(-35 160 170)"/><ellipse cx="160" cy="170" rx="130" ry="135"/><path d="M0 170h320M160 8v304" stroke-dasharray="2 7"/></g>
          <g stroke="var(--ink)" stroke-width="1.2"><path d="m92 141 69-40 69 40-69 40Z" fill="var(--surface)"/><path d="m92 141 69 40v83l-69-40Z" fill="url(#edge)"/><path d="m161 181 69-40v83l-69 40Z" fill="url(#face)"/><path d="m149 60 37-21 37 21-37 22Z" fill="var(--surface)"/><path d="m149 60 37 22v43l-37-22Z" fill="url(#edge)"/><path d="m186 82 37-22v43l-37 22Z" fill="url(#face)"/></g>
          <g fill="var(--accent)"><circle cx="36" cy="153" r="6"/><circle cx="267" cy="86" r="4"/><circle cx="224" cy="289" r="4"/></g>
        </svg>
      </div>
      <div class="steps"><article><span>01</span><h2>Find your offer</h2></article><article><span>02</span><h2>Build the system</h2></article><article><span>03</span><h2>Win the next client</h2></article></div>
    </main>
    <footer><span id="instruction">Click anywhere to set the wave origin.</span><output id="status" aria-live="polite"></output></footer>
  </div>
  <script type="module" src="./stage.mjs"></script>
</body>
</html>
